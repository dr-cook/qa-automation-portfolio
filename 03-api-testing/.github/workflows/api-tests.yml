name: API Tests — RestAssured + TestNG

on:
  push:
    branches: [ main ]
    paths:
      - '03-api-testing/**'
  pull_request:
    branches: [ main ]
    paths:
      - '03-api-testing/**'
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-api-testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Smoke Tests
        run: mvn test -Dgroups=smoke
        env:
          API_BASE_URL: https://reqres.in

      - name: Run Regression Tests
        if: github.event_name == 'push'
        run: mvn test -Dgroups=regression
        env:
          API_BASE_URL: https://reqres.in

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: 03-api-testing/target/allure-results
          retention-days: 7
